### model
model_name_or_path: models/gemma-3-270m-it

### method
stage: sft
do_train: true
finetuning_type: full

### dataset
dataset_dir: data/v3-2-0-1.0.0-134feaba
dataset: v3_2_0_sft_train
eval_dataset: v3_2_0_sft_validation
template: gemma2
cutoff_len: 4096
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/gemma3-270m/full/sft
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### training
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### evaluation
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100

### SwanLab
use_swanlab: true
swanlab_project: plan_sft
swanlab_run_name: gemma3-270m-full-sft
swanlab_mode: cloud
swanlab_logdir: llamafactory_runs/gemma3-270m-full-sft_260919_v1/swanlab
# swanlab_api_key 通过环境变量 SWANLAB_API_KEY 提供，不写入文件